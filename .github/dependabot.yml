version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # azurerm major versions change resource schemas; upgrade all modules together by hand.
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
